plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

evaluationDependsOn(':livingmods-sidecar')

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'livingmods.sidecar.enabled', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'livingmods.sidecar.enabled', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':livingmods-common')
    implementation project(':livingmods-protocol')
    implementation project(':livingmods-worldgen')
    implementation project(':livingmods-simulation')

    // Sidecar fat jar is packaged into resources for process launch.
}

def sidecarJarTask = project(':livingmods-sidecar').tasks.named('sidecarJar', Jar)

tasks.register('copySidecarJar', Copy) {
    dependsOn sidecarJarTask
    from sidecarJarTask
    into layout.buildDirectory.dir('generated/sidecar')
    rename { 'livingmods-sidecar.jar' }
}

sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/sidecar')
tasks.named('processResources') {
    dependsOn copySidecarJar
}

tasks.named('sourcesJar') {
    dependsOn copySidecarJar
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
