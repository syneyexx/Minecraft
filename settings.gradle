pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'livingmods'

include 'livingmods-common'
include 'livingmods-protocol'
include 'livingmods-worldgen'
include 'livingmods-simulation'
include 'livingmods-sidecar'
include 'livingmods-neoforge'
include 'livingmods-testkit'
include 'livingmods-tools'
